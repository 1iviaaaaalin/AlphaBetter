<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Protein 3D Viewer</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: white;
    }

    #viewer {
      width: 100%;
      height: 100%;
      position: relative;
    }

    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      color: #667085;
      font-size: 16px;
      z-index: 10;
    }

    #error {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 30px;
      box-sizing: border-box;
      background: white;
      color: #d92d20;
      font-size: 15px;
      text-align: center;
      z-index: 20;
    }
  </style>

  <script src="https://unpkg.com/ngl@2.0.0-dev.37/dist/ngl.js"></script>
</head>

<body>

  <div id="viewer">
    <div id="loading">正在加载 3D 查看器...</div>
    <div id="error"></div>
  </div>

  <script>

    // ==============================
    // 1. 获取页面元素
    // ==============================

    const loading = document.getElementById("loading");
    const errorBox = document.getElementById("error");

    let stage = null;
    let currentComponent = null;


    // ==============================
    // 2. 创建 NGL 查看器
    // ==============================

    function initViewer() {

      try {

        if (typeof NGL === "undefined") {
          throw new Error("NGL 加载失败");
        }

        stage = new NGL.Stage("viewer", {
          backgroundColor: "white"
        });

        window.addEventListener("resize", function () {
          if (stage) {
            stage.handleResize();
          }
        });

        // 告诉主页面：3D 查看器已经准备好了
        window.parent.postMessage(
          {
            type: "viewerReady"
          },
          "*"
        );

      } catch (error) {

        console.error(error);

        loading.style.display = "none";

        errorBox.style.display = "flex";

        errorBox.textContent =
          "3D 查看器加载失败：" + error.message;
      }
    }


    // ==============================
    // 3. 创建颜色方案
    // ==============================

    function createScoreScheme() {

      return NGL.ColormakerRegistry.addScheme(
        function () {

          this.atomColor = function (atom) {

            const score = Number(atom.bfactor) || 0;

            // 接近 0：黄色
            if (Math.abs(score) <= 0.05) {
              return 0xffff00;
            }

            // 小于 0：红色
            if (score < 0) {
              return 0xff3030;
            }

            // 大于 0：绿色
            return 0x20a050;

          };

        },
        "stability-score"
      );
    }


    // ==============================
    // 4. 加载 PDB
    // ==============================

    async function loadPDB(pdbText) {

      try {

        if (!stage) {
          throw new Error("3D 查看器尚未初始化");
        }

        if (!pdbText) {
          throw new Error("没有收到 PDB 数据");
        }

        loading.style.display = "flex";
        errorBox.style.display = "none";

        // 删除之前的结构
        if (currentComponent) {
          currentComponent.dispose();
          currentComponent = null;
        }

        // 把文字转换成文件
        const blob = new Blob(
          [pdbText],
          {
            type: "text/plain"
          }
        );

        const file = new File(
          [blob],
          "structure.pdb",
          {
            type: "text/plain"
          }
        );

        // 让 NGL 读取 PDB
        currentComponent = await stage.loadFile(
          file,
          {
            ext: "pdb"
          }
        );

        // 创建稳定性颜色方案
        const schemeId = createScoreScheme();

        // 显示 cartoon
        currentComponent.addRepresentation(
          "cartoon",
          {
            color: schemeId,
            quality: "medium"
          }
        );

        // 自动调整视角
        currentComponent.autoView();

        stage.handleResize();

        loading.style.display = "none";

      } catch (error) {

        console.error(error);

        loading.style.display = "none";

        errorBox.style.display = "flex";

        errorBox.textContent =
          "3D 结构加载失败：" + error.message;
      }
    }


    // ==============================
    // 5. 接收主页面发送的 PDB
    // ==============================

    window.addEventListener(
      "message",
      function (event) {

        if (!event.data) {
          return;
        }

        if (event.data.type === "loadPDB") {

          loadPDB(event.data.pdbText);

        }

      }
    );


    // ==============================
    // 6. 暴露 loadPDB
    // ==============================

    window.loadPDB = loadPDB;


    // ==============================
    // 7. 启动查看器
    // ==============================

    initViewer();

  </script>

</body>
</html>
